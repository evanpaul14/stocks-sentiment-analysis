name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # setup-node's npm cache only avoids re-downloading tarballs — npm ci
      # still does a full clean reinstall every run regardless, which was the
      # entire deploy time (~7min of a ~7.5min run). Caching node_modules
      # directly and skipping npm ci on an unchanged lockfile turns that into
      # a few seconds for the common case.
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # A second, prod-only node_modules built alongside the dev one, so
      # packaging can restore it directly instead of running `npm prune
      # --omit=dev` on the full tree every run. Pruning has to individually
      # stat+unlink devDependency files out of a 800MB+/50k-file tree, which
      # cost ~100s regardless of whether the lockfile changed; this cache
      # only misses (and pays for a second `npm ci`) on the same lockfile
      # changes that already invalidate the cache above.
      - name: Restore prod-only node_modules cache
        id: prod-node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: prod-modules/node_modules
          key: node-modules-prod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.prod-node-modules-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p prod-modules
          cp package.json package-lock.json prod-modules/
          npm ci --omit=dev --prefix prod-modules

      - if: steps.prod-node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: prod-modules/node_modules
          key: ${{ steps.prod-node-modules-cache.outputs.cache-primary-key }}

      # Pre-migrate the disposable CI-local DB single-threaded before build.
      # next build's parallel page-data workers each import lib/db/client,
      # which self-migrates on open — racing that across workers on a fresh
      # (nonexistent) DB file causes "duplicate column" / "database is
      # locked" errors. This DB is never shipped; only .next + node_modules
      # are packaged below.
      - run: npm run db:migrate

      # NEXT_PUBLIC_* vars are inlined into the client JS bundle at build
      # time (not read at runtime), so they must be present here in CI —
      # setting them on the VPS's .env alone does nothing for the bundle,
      # since the VPS only ever runs what CI already built.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

      - name: Package build artifact
        # .next/cache is build-only (not read by `next start`) and there's no
        # cross-run cache configured for it here, so shipping it is pure
        # waste — it was ~128MB of every artifact and every deploy's disk.
        # node_modules comes from prod-modules/ (prod-only, built above) so
        # this never has to prune the dev tree `build` just used.
        run: tar -I 'zstd -T0 -3' --exclude='.next/cache' -cf artifact.tar.zst .next -C prod-modules node_modules

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # The server's forced command (ci-deploy-receive.sh) ignores whatever
          # command we pass and always runs itself, reading this tarball from
          # stdin — it does its own git fetch/reset, extraction, and restart.
          ssh -i ~/.ssh/deploy_key flaskuser@"$DEPLOY_HOST" < artifact.tar.zst
