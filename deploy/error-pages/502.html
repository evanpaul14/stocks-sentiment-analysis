<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Site temporarily unavailable — Stock Sentiment</title>
<style>
  :root {
    color-scheme: dark;
    --background: #0f0d0b;
    --foreground: #ece8e2;
    --muted-foreground: #a29b90;
    --primary: #cba055;
    --border: rgba(236, 232, 226, 0.1);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    max-width: 26rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  p.code {
    margin: 0;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
    color: var(--muted-foreground);
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
  }
  p.body {
    margin: 0;
    font-size: 0.9375rem;
    color: var(--muted-foreground);
  }
  a.button {
    margin-top: 0.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 2rem;
    padding: 0 0.625rem;
    border-radius: 0.75rem;
    background: var(--primary);
    color: #1e1a10;
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: none;
  }
  a.button:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>
  <main>
    <p class="code">502</p>
    <h1>We&rsquo;ll be right back</h1>
    <p class="body">
      The site is temporarily unavailable while we sort out a hiccup on our end.
      Try refreshing in a minute.
    </p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
